name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HIRA_REQUIRE_BROWSER_TESTS: "1"
      PYTHONPYCACHEPREFIX: /tmp/hira-pycache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Check frontend syntax
        run: |
          node --check pwa/app.js
          node --check pwa/integrations.js
          node --check pwa/service-worker.js
          node --check pwa/classops.js
          node --check pwa/hira-growth.js

      - name: Run complete Python suite
        run: python scripts/dev_check.py

      - name: Run browser regression suite
        run: python -m unittest tests.test_pwa_topic_news_ui -q
